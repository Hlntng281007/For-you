<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071016">
  <title>For You</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #071016;
      --ice: #72c8ef;
      --paper: #fff9ef;
      --muted: #9caeb7;
      --line: rgba(201, 226, 237, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      color: var(--paper);
      background-color: var(--ink);
      background-image:
        linear-gradient(135deg, rgba(38, 92, 113, 0.12), transparent 42%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0 1px, transparent 1px 4px);
      font-family: "Avenir Next", "Trebuchet MS", sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .signature {
      position: fixed;
      z-index: 1;
      top: max(24px, env(safe-area-inset-top));
      left: clamp(20px, 4vw, 56px);
      display: flex;
      align-items: center;
      gap: 10px;
      color: #c7d5db;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .signature::before {
      width: 22px;
      height: 1px;
      background: var(--ice);
      content: "";
      box-shadow: 0 0 10px rgba(114, 200, 239, 0.7);
    }

    .controls {
      position: fixed;
      z-index: 2;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(5, 12, 17, 0.86);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
      transform: translateX(-50%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    button {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 0 13px;
      color: var(--paper);
      background: transparent;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    button:hover {
      border-color: rgba(114, 200, 239, 0.35);
      background: rgba(114, 200, 239, 0.1);
    }

    button:focus-visible {
      outline: 2px solid var(--ice);
      outline-offset: 3px;
    }

    #music-toggle {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 138px;
      justify-content: center;
      color: #061117;
      background: var(--ice);
    }

    #music-toggle:hover {
      border-color: transparent;
      background: #a0ddf8;
    }

    .symbol {
      width: 16px;
      font-size: 14px;
      line-height: 1;
      text-align: center;
    }

    #replay {
      display: grid;
      width: 42px;
      padding: 0;
      place-items: center;
      color: #d4e0e5;
      font-size: 21px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    @media (max-width: 480px) {
      .signature { top: max(18px, env(safe-area-inset-top)); }
      .controls { bottom: max(14px, env(safe-area-inset-bottom)); }
      button { min-height: 44px; }
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="signature" aria-hidden="true">For you</div>

  <main class="sr-only">
    <h1>Love you</h1>
    <p>An animated heart made of glowing words.</p>
  </main>

  <div class="controls" aria-label="Animation controls">
    <button id="music-toggle" type="button" aria-label="Play music" aria-pressed="false">
      <span class="symbol" aria-hidden="true">▶</span>
      <span class="button-label">Play music</span>
    </button>
    <button id="replay" type="button" aria-label="Replay animation" title="Replay animation">↻</button>
  </div>

  <audio id="music" preload="auto" loop>
    <source src="love_you.wav" type="audio/wav">
    <source src="love_you.mp3" type="audio/mpeg">
  </audio>

  <script>
    (() => {
      const canvas = document.querySelector("#scene");
      const context = canvas.getContext("2d");
      const audio = document.querySelector("#music");
      const musicToggle = document.querySelector("#music-toggle");
      const musicSymbol = musicToggle.querySelector(".symbol");
      const musicLabel = musicToggle.querySelector(".button-label");
      const replayButton = document.querySelector("#replay");
      const words = ["love you", "Love You", "LOVE YOU"];
      const colors = ["#4682b4", "#1e90ff", "#00bfff", "#6495ed", "#4169e1"];
      const outlineCount = 160;
      const fillCount = 130;
      const framesPerStep = 1.6;
      const frameDuration = 1000 / 60;

      let width = 0;
      let height = 0;
      let scale = 1;
      let particles = [];
      let fillStartFrame = 0;
      let startTime = performance.now();
      let lastTime = startTime;

      function heartPoint(t) {
        const x = 16 * Math.sin(t) ** 3;
        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        return [x, -y];
      }

      function screenPoint(point) {
        return [width / 2 + point[0] * scale, height / 2 + (point[1] - 6) * scale];
      }

      function isSpaced(point, placed, minGap) {
        for (const other of placed) {
          if (Math.hypot(point[0] - other[0], point[1] - other[1]) < minGap) return false;
        }
        return true;
      }

      function makeParticle(x, y, order, kind) {
        return {
          x,
          y,
          order,
          kind,
          word: words[Math.floor(Math.random() * words.length)],
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 0,
          flicker: Math.random() * Math.PI * 2,
          delay: 0,
          size: 0.85 + Math.random() * 0.3,
        };
      }

      function buildParticles() {
        const outline = [];
        const outlinePoints = [];
        const outlineGap = scale * 1.5;

        for (let i = 0; i < outlineCount; i += 1) {
          const point = screenPoint(heartPoint((i / outlineCount) * Math.PI * 2));
          if (!isSpaced(point, outlinePoints, outlineGap)) continue;
          outlinePoints.push(point);
          outline.push(makeParticle(point[0], point[1], i, "outline"));
        }

        const fill = [];
        const fillPoints = [];
        const fillGap = scale * 2.3;
        let attempts = 0;

        while (fill.length < fillCount && attempts < fillCount * 80) {
          attempts += 1;
          const t = Math.random() * Math.PI * 2;
          const radius = Math.random() * 0.86;
          const [x, y] = heartPoint(t);
          const point = screenPoint([x * radius, y * radius]);
          if (!isSpaced(point, fillPoints, fillGap)) continue;
          fillPoints.push(point);
          fill.push(makeParticle(point[0], point[1], Math.floor(Math.random() * 321), "fill"));
        }

        const outlineSpan = outline.reduce((largest, particle) => Math.max(largest, particle.order), 0);
        fillStartFrame = Math.floor(outlineSpan * framesPerStep) + 30;
        for (const particle of fill) particle.delay = fillStartFrame + particle.order;
        for (const particle of outline) particle.delay = Math.floor(particle.order * framesPerStep);
        particles = [...outline, ...fill];
      }

      function resize() {
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        scale = Math.min(width / 38, height / 30);
        buildParticles();
      }

      function drawParticle(particle, frame, frameStep) {
        if (frame > particle.delay && particle.alpha < 1) {
          particle.alpha = Math.min(1, particle.alpha + frameStep * (14 + Math.random() * 4) / 255);
        }
        if (particle.alpha <= 0) return;

        const flicker = particle.alpha >= 1
          ? 0.75 + 0.25 * Math.sin(frame * 0.04 + particle.flicker)
          : 1;
        const alpha = particle.alpha * flicker;
        const baseSize = particle.kind === "outline" ? 20 : 17;
        const fontSize = baseSize * particle.size * Math.min(1, scale / 20);

        context.save();
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.font = `700 ${fontSize}px "Avenir Next", "Trebuchet MS", sans-serif`;
        context.fillStyle = particle.color;
        context.shadowColor = particle.color;
        context.globalAlpha = alpha / 7;
        context.shadowBlur = 25 * particle.size;
        context.fillText(particle.word, particle.x, particle.y);
        context.globalAlpha = alpha;
        context.shadowBlur = 8 * particle.size;
        context.fillText(particle.word, particle.x, particle.y);
        context.restore();
      }

      function drawCenter(frame) {
        const centerStart = fillStartFrame + 200;
        if (frame <= centerStart) return;

        const progress = Math.min(1, (frame - centerStart) / 60);
        const alpha = 1 - Math.exp(-progress * 8);
        const pulse = 1 + 0.025 * Math.sin(frame * 0.05);
        const fontSize = 54 * Math.min(1, Math.max(0.66, scale / 20)) * pulse;

        context.save();
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.font = `700 ${fontSize}px Georgia, "Palatino Linotype", serif`;
        context.fillStyle = "#fffaf0";
        context.globalAlpha = alpha;
        context.shadowColor = "rgba(255, 250, 240, 0.72)";
        context.shadowBlur = 22;
        context.fillText(" Love You ", width / 2, height / 2);
        context.restore();
      }

      function animate(now) {
        const frameStep = Math.min(3, (now - lastTime) / frameDuration);
        const frame = (now - startTime) / frameDuration;
        lastTime = now;
        context.clearRect(0, 0, width, height);
        for (const particle of particles) drawParticle(particle, frame, frameStep);
        drawCenter(frame);
        requestAnimationFrame(animate);
      }

      function syncMusicButton() {
        const isPlaying = !audio.paused;
        musicSymbol.textContent = isPlaying ? "Ⅱ" : "▶";
        musicLabel.textContent = isPlaying ? "Pause music" : "Play music";
        musicToggle.setAttribute("aria-label", isPlaying ? "Pause music" : "Play music");
        musicToggle.setAttribute("aria-pressed", String(isPlaying));
      }

      musicToggle.addEventListener("click", async () => {
        if (audio.paused) {
          try {
            await audio.play();
          } catch (error) {
            musicLabel.textContent = "Audio unavailable";
            musicToggle.setAttribute("aria-label", "Audio unavailable");
          }
        } else {
          audio.pause();
        }
        syncMusicButton();
      });

      audio.addEventListener("play", syncMusicButton);
      audio.addEventListener("pause", syncMusicButton);
      replayButton.addEventListener("click", () => {
        startTime = performance.now();
        lastTime = startTime;
        buildParticles();
      });
      window.addEventListener("resize", () => {
        resize();
        startTime = performance.now();
        lastTime = startTime;
      });

      resize();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
